name: Fabriquer l’image du fork

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      publish_family_channel:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nadios-vistos/nutritrace

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du fork
        uses: actions/checkout@v4

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l’image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publier la version validée pour TrueNAS
        if: inputs.publish_family_channel
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          head_sha=$(git ls-remote origin refs/heads/mode-familial | cut -f1)
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo 'La branche a avancé. Cette image conserve uniquement son tag de commit.'
            exit 0
          fi
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE:mode-familial" "$IMAGE@$DIGEST"

      - name: Afficher la ligne à copier dans TrueNAS
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Image à utiliser dans TrueNAS'
            echo '```yaml'
            printf 'image: %s@%s\n' "$IMAGE" "$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
